name: Release

on:
  push:
    tags:
      - '*.*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          Write-Host "Tag version: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pack NuGet
        shell: pwsh
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          $proj = 'src\Wpf.Ui.Violeta\Wpf.Ui.Violeta.csproj'
          $version = '${{ steps.version.outputs.tag }}'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          dotnet restore $proj /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $proj -c Release --no-restore /p:Version=$version /p:PackageVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack $proj -c Release --no-build -o build /p:Version=$version /p:PackageVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\*.nupkg, build\*.snupkg | ForEach-Object { Write-Host $_.Name }

      - name: Pack Gallery
        shell: pwsh
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          $proj = 'src\Wpf.Ui.Violeta.Gallery\Wpf.Ui.Violeta.Gallery.csproj'
          $outDir = 'build\Wpf.Ui.Violeta.Gallery'
          $zipPath = 'build\Wpf.Ui.Violeta.Gallery.zip'
          # net48 does not support PublishSingleFile / SelfContained (NETSDK1125).
          # Always pass the csproj: leftover *_wpftmp.csproj files make bare `dotnet restore` hit MSB1011.
          dotnet restore $proj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish $proj -c Release -o $outDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $outDir)) {
            Write-Error "Gallery output directory not found: $outDir"
            exit 1
          }
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path $outDir).Path,
            (Join-Path (Resolve-Path build).Path 'Wpf.Ui.Violeta.Gallery.zip'),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true)
          Write-Host "Created $zipPath"

      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $repo = '${{ github.repository }}'
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          # Keep the full Keep-a-Changelog section, including "## [x.y.z.w] - YYYY-MM-DD".
          $pattern = "(?ms)^(?<section>## \[$([regex]::Escape($tag))\].*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            Write-Error "CHANGELOG.md has no section for [$tag]. Update CHANGELOG before tagging."
            exit 1
          }
          $notes = $match.Groups['section'].Value.TrimEnd()
          # Previous version is the next "## [..]" heading in CHANGELOG (same as manual releases).
          $rest = $changelog.Substring($match.Index + $match.Length)
          $prevMatch = [regex]::Match($rest, '(?m)^## \[([^\]]+)\]')
          if ($prevMatch.Success) {
            $prev = $prevMatch.Groups[1].Value
            $notes = "$notes`r`n`r`n**Full Changelog**: https://github.com/$repo/compare/$prev...$tag"
          }
          $notesPath = Join-Path (Get-Location) 'release-notes.md'
          [System.IO.File]::WriteAllText($notesPath, $notes + "`r`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host $notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            build/*.nupkg
            build/*.snupkg
            build/Wpf.Ui.Violeta.Gallery.zip
          fail_on_unmatched_files: true

      - name: Push NuGet package
        shell: pwsh
        env:
          DOTNET_CLI_UI_LANGUAGE: en
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_AUTH_TOKEN)) {
            Write-Host 'Secret NUGET_AUTH_TOKEN is not set; skipping NuGet push.'
            exit 0
          }
          Get-ChildItem build\*.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)"
            dotnet nuget push $_.FullName `
              --api-key $env:NUGET_AUTH_TOKEN `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
